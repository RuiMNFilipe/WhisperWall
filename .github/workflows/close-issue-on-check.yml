name: Close Subtasks on Checklist Update

on:
  issues:
    types: [edited] # Triggers when an issue's body is updated

jobs:
  close_subtasks:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Closed Subtasks
        uses: actions/github-script@v6
        with:
          script: |
            const { context, github } = require("@actions/github");

            const body = context.payload.issue.body;

            if (!body) {
              console.log("No issue body found.");
              return;
            }

            // Find all checked checklist items linked to issues
            const checkedItems = body.match(/- \[x\] .*#\d+/gi) || [];

            for (const item of checkedItems) {
              const issueNumberMatch = item.match(/#(\d+)/);
              if (!issueNumberMatch) continue;

              const issueNumber = parseInt(issueNumberMatch[1], 10);

              // Close the linked issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: "closed",
              });

              console.log(`Closed issue #${issueNumber}`);
            }
